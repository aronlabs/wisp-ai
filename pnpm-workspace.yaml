packages:
  - apps/*
  - packages/*
  - scripts
  - tests
  - addon

allowBuilds:
  esbuild: true

# Package boundaries stay explicit; undeclared transitive imports are not hoisted.
hoist: false

# Optional native archive codecs from just-bash are not used by Wisp.
# Eve also excludes these when installing its optional just-bash engine.
ignoredOptionalDependencies:
  - '@mongodb-js/zstd'
  - node-liblzma
