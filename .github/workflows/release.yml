name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: ./scripts/package-release.ps1
        shell: pwsh
      - run: node scripts/verify-release.ts
      - uses: actions/upload-artifact@v4
        with:
          name: Wisp-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.sha256
