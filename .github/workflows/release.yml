name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: choco install protoc --yes --no-progress
      - run: ./scripts/build-simulator.ps1
        shell: pwsh
      - run: npm test
      - run: npm run build:desktop
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: node scripts/verify-installer.ts
      - uses: actions/upload-artifact@v4
        with:
          name: Wisp-windows-x64
          path: |
            dist/*-setup.exe
            dist/*.sha256
            src-tauri/Cargo.lock
            src-tauri/src/*.rs
            src-tauri/build.rs
            dist/installer-smoke.json
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*-setup.exe
            dist/*.sha256
